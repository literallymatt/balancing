[project]
name = "bm-charts"
version = "0.1.0"
description = "Pull Balancing Mechanism bid and offer data from Elexon BMRS and chart it for the flexibility deck"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "matplotlib>=3.8",
    "xlsxwriter>=3.3.0",
]

[project.scripts]
bm-charts = "bm_charts.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bm_charts"]
